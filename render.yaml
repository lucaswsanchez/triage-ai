services:
  - type: web
    name: triage-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-flash
      - key: LLM_MAX_TOKENS
        value: "700"
      - key: RATE_LIMIT_REQUESTS
        value: "10"
      - key: DAILY_LLM_BUDGET
        value: "300"
      - key: CORS_ORIGINS
        sync: false
